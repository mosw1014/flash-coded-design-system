name: Verify changelog updated

# Enforces CLAUDE.md rule 4 mechanically: any PR that changes index.html must
# also add a new entry to the in-app CHANGELOG. Same spirit as
# verify-ai-context.yml — a contributor (or an AI session) doesn't need to
# have read CLAUDE.md to get an actionable failing check.
#
# Deliberately no `paths:` filter here: this is a required status check on
# main, and a path-filtered trigger means PRs that don't touch index.html
# never get a run at all — GitHub then waits forever for a check that will
# never report, permanently blocking merge. Instead this always runs, and
# scripts/verify-changelog.mjs itself exits 0 immediately when index.html
# is unchanged against the base ref.

on:
  pull_request:

jobs:
  verify-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check a CHANGELOG entry was added
        run: node scripts/verify-changelog.mjs --base "origin/${{ github.event.pull_request.base.ref }}"
